<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    O Flutter substitui este valor pelo argumento --base-href durante o build,
    permitindo hospedar a base em um subdiretório. O caminho deve começar
    e terminar com uma barra.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Base Flutter Web para o Jogo da Forca.">

  <!-- Metadados e ícone para adicionar à tela inicial -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jogo da Forca">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Ícone da aba do navegador -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jogo da Forca</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
